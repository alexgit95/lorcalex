name: Build and Push Docker Image

# Déclencheur : chaque push sur la branche main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Se connecter au Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Configurer Buildx (pour des builds plus rapides et avancés)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build et Push de l'image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Remplace "mon-utilisateur" et "mon-repo" par tes vraies infos
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lorcalex:latest