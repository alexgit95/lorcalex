spring.application.name=lorcalex
server.port=8181

# Active profile: local (SQLite) or docker (PostgreSQL)
spring.profiles.active=local

# JPA common settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
# IMPORTANT: Change this secret in production (must be at least 32 characters)
app.jwt.secret=${JWT_SECRET:lorcalex-super-secret-key-change-in-production-!}
app.jwt.expiration=86400000

# Admin credentials (overridden by env vars in Docker)
app.admin.username=${APP_USERNAME:admin}
app.admin.password=${APP_PASSWORD:admin}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.alexgit95=INFO
