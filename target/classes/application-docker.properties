# PostgreSQL configuration for Docker deployment
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/lorcalex}
spring.datasource.username=${DB_USERNAME:lorcalex}
spring.datasource.password=${DB_PASSWORD:lorcalex}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
