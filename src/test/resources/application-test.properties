# H2 in-memory database for integration tests
spring.datasource.url=jdbc:h2:mem:lorcatest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable SQLite-specific property
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=

# Minimal JWT/admin settings
app.jwt.secret=test-secret-key-for-unit-tests-at-least-32-chars
app.jwt.expiration=3600000
app.admin.username=admin
app.admin.password=admin
