# PostgreSQL configuration for Docker deployment
spring.datasource.url=jdbc:postgresql://db:5432/lorcalex
spring.datasource.username=${POSTGRES_USER:lorcalex}
spring.datasource.password=${POSTGRES_PASSWORD:lorcalex}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
